[package]
name = "phantom-court-server"
version = "0.1.0"
edition = "2021"
description = "Authoritative 60 Hz UDP simulation & HTTP backend server for Phantom Court Online"

[lib]
name = "phantom_court_server"
path = "src/lib.rs"

[[bin]]
name = "phantom-court-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }
